<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WinRadio — Settings modal (key screen)</title>
<style>
/*
  Governs: EXPERIENCE.md — Information Architecture (Settings row),
  Component Patterns (Settings modal), State Patterns (Settings saved).
  Canonical state shown: modal open over a dimmed dashboard, three rows
  (tray behavior, Sleep Timer default, theme toggle) — no Apply button,
  changes commit immediately per FR-12's no-explicit-save pattern.
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #3a3a3f;
  font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
}
.stage { position: relative; width: 640px; height: 420px; }
.backdrop {
  position: absolute; inset: 0; background: #101012; border-radius: 6px;
  opacity: 0.5;
}
.overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.modal { width: 340px; background: #18181b; border-radius: 4px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.modal h2 { color: #f5f5f7; font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2a2a2f; }
.row:last-child { border-bottom: none; }
.row .label { color: #f5f5f7; font-size: 13px; }
.toggle { width: 36px; height: 20px; border-radius: 9999px; background: #2a2a2f; position: relative; }
.toggle.on { background: #7c5cff; }
.toggle .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 9999px; background: #f5f5f7; }
.toggle.on .knob { left: 18px; }
.select { color: #9a9aa2; font-size: 12px; background: #101012; border: 1px solid #2a2a2f; border-radius: 2px; padding: 4px 8px; }
.theme-pair { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #9a9aa2; }
.theme-pair b { color: #f5f5f7; }
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop"></div>
  <div class="overlay">
    <div class="modal">
      <h2>Settings</h2>
      <div class="row">
        <span class="label">Minimize to tray</span>
        <div class="toggle on"><div class="knob"></div></div>
      </div>
      <div class="row">
        <span class="label">Sleep Timer default</span>
        <span class="select">30 min ▾</span>
      </div>
      <div class="row">
        <span class="label">Theme</span>
        <span class="theme-pair"><b>Dark</b> / Light</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
