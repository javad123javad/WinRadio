[package]
name = "winradio"
version = "0.2.3"
edition = "2021"
rust-version = "1.85.0"

[features]
# Forwards to tauri's own `custom-protocol` feature — without this, `tauri
# build`'s `--features custom-protocol` flag is a no-op on this crate and the
# compiled binary still tries to load the devPath dev-server URL instead of
# the bundled assets, even in a release build.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "notification-all", "shell-all", "fs-all", "window-all", "global-shortcut-all", "dialog-all", "windows7-compat", "system-tray", "global-shortcut", "notification", "dialog"] }
rodio = { version = "0.19", features = ["symphonia-all"] }
symphonia = { version = "0.6", features = ["mp3", "aac", "vorbis", "flac", "ogg"] }
stream-download = { version = "0.24", features = ["reqwest"] }
icy-metadata = { version = "0.6", default-features = false }
# Must track the reqwest major version stream-download 0.24 vendors (^0.13) so
# Cargo unifies both into a single dependency instance; declared directly (in
# addition to stream-download's own optional dep) purely to turn on a TLS
# backend, which stream-download's own reqwest feature set does not enable.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "query"] }
http = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "time", "sync", "macros"] }
once_cell = "1.19"
parking_lot = "0.12"
dirs = "5.0"
# Encodes the OSM tile fetched by `directory::get_location_tile` as a base64
# data URL (spec-2-2) — the frontend never hotlinks the tile image directly.
base64 = "0.22"
